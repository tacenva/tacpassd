
name: Build Go Binary
description: Setup Go and build tacpassd for the target platform

inputs:
  goos:
    description: Target operating system
    required: true
  goarch:
    description: Target architecture
    required: true
  version:
    description: Application version
    required: true

outputs:
  binary:
    description: Path to the built binary
    value: ${{ steps.build.outputs.binary }}

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Install cross-compilation dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Install Windows GCC
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc
        
    - name: Build
      id: build
      shell: bash
      env:
        GOOS: ${{ inputs.goos }}
        GOARCH: ${{ inputs.goarch }}
        VERSION: ${{ inputs.version }}
      run: |
        mkdir -p dist

        NAME="tacpassd-${GOOS}-${GOARCH}"

        if [ "$GOOS" = "windows" ]; then
          NAME="${NAME}.exe"
        fi

        export CGO_ENABLED=1
        export GOOS="$GOOS"
        export GOARCH="$GOARCH"

        if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "arm64" ]; then
          export CC=aarch64-linux-gnu-gcc
        fi

        go build \
          -trimpath \
          -ldflags="-s -w -X github.com/tacenva/tacpassd/internal/app.Version=${VERSION}" \
          -o "dist/${NAME}" \
          ./cmd/tacpassd

        echo "binary=dist/${NAME}" >> "$GITHUB_OUTPUT"
